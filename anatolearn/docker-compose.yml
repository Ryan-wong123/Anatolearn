services:
  postgres:
    image: postgres:16
    container_name: anatolearn-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: anatolearn
      POSTGRES_PASSWORD: password
      POSTGRES_DB: anatolearn

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: anatolearn-backend
    restart: unless-stopped

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./public:/public

    environment:
      PORT: 5000
      DATABASE_URL: postgres://anatolearn:password@postgres:5432/anatolearn
      PUBLIC_DIR: /public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-before-any-real-deployment}
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:-dev-teacher-code}

    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: anatolearn-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      BACKEND_URL: http://backend:5000

    depends_on:
      - backend

  operations:
    image: postgres:16
    profiles: [ops]
    environment:
      PGHOST: postgres
      PGUSER: anatolearn
      PGPASSWORD: password
      PGDATABASE: anatolearn
    volumes:
      - ./ops:/ops:ro
      - ./public:/assets:ro
      - ./backups:/backups

volumes:
  postgres_data:
