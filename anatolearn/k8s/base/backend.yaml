apiVersion: apps/v1
kind: Deployment
metadata:
  name: anatolearn-backend
  labels: { app.kubernetes.io/name: anatolearn, app.kubernetes.io/component: backend }
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: anatolearn, app.kubernetes.io/component: backend }
  template:
    metadata:
      labels: { app.kubernetes.io/name: anatolearn, app.kubernetes.io/component: backend }
    spec:
      serviceAccountName: anatolearn
      # AWS SDK needs the projected IRSA token, so this pod (unlike the others) mounts it.
      automountServiceAccountToken: true
      # Large uploads (200 MB) can be in flight when a pod is replaced: give them time to finish.
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: anatolearn, app.kubernetes.io/component: backend }
      containers:
        - name: backend
          image: anatolearn-backend
          ports: [{ name: http, containerPort: 5000 }]
          envFrom:
            - configMapRef: { name: anatolearn-config }
            - secretRef: { name: anatolearn-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi, ephemeral-storage: 1Gi }
            limits: { memory: 1Gi, ephemeral-storage: 2Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            # Uploads are staged here (os.tmpdir) while they are validated and virus scanned, then copied to S3.
            - { name: tmp, mountPath: /tmp }
          # /api/health queries Postgres. It gates traffic only: a database outage must not restart healthy pods.
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
            failureThreshold: 3
          lifecycle:
            # Let the endpoint controller stop routing here before SIGTERM closes the listener.
            preStop:
              exec: { command: ["sleep", "10"] }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: anatolearn-backend
  labels: { app.kubernetes.io/name: anatolearn, app.kubernetes.io/component: backend }
spec:
  selector: { app.kubernetes.io/name: anatolearn, app.kubernetes.io/component: backend }
  ports: [{ name: http, port: 5000, targetPort: http }]
