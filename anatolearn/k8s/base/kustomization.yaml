apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: anatolearn
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - backend.yaml
  - web.yaml
  - clamav.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - migrate-job.yaml
  - backup-cronjob.yaml
configMapGenerator:
  - name: anatolearn-config
    literals:
      - NODE_ENV=production
      - PORT=5000
      # Ingress -> web (nginx) -> backend: two proxies append to X-Forwarded-For.
      - TRUST_PROXY=2
      - STORAGE_DRIVER=s3
      - CLAMAV_HOST=anatolearn-clamav
      - CLAMAV_REQUIRED=true
      - MFA_REQUIRED=true
      - CACHE_ENABLED=true
      # Migrations run in the anatolearn-migrate Job, not in every pod.
      - RUN_MIGRATIONS=false
      # replicas x DB_POOL_MAX must stay below the database max_connections.
      - DB_POOL_MAX=10
      - UPLOAD_QUOTA_MB_PER_USER=5120
      - UPLOAD_QUOTA_MB_TOTAL=51200
      - SESSION_IDLE_MINUTES_STAFF=120
      - SESSION_IDLE_MINUTES_STUDENT=480
      - WEBAUTHN_RP_NAME=AnatoLearn
  - name: anatolearn-nginx
    files:
      - upstream.conf=nginx-upstream.conf
generatorOptions:
  disableNameSuffixHash: false
images:
  - name: anatolearn-backend
    newName: anatolearn-backend
    newTag: latest
  - name: anatolearn-web
    newName: anatolearn-web
    newTag: latest
  - name: anatolearn-backup
    newName: anatolearn-backup
    newTag: latest
