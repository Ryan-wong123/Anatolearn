# Production stack:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Public entry point is Caddy (automatic HTTPS). Assets live in S3 via the EC2 instance role.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anatolearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-anatolearn}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 2   # caddy + nginx
      DATABASE_URL: postgres://${POSTGRES_USER:-anatolearn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anatolearn}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters)}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?set FRONTEND_ORIGINS, e.g. https://anatolearn.example.com}
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:?set TEACHER_INVITE_CODE}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.prod
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. anatolearn.example.com}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
