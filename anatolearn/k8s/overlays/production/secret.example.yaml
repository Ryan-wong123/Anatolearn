# NOT part of the kustomization. Copy to secret.yaml (git-ignored), fill in, then `kubectl apply -f secret.yaml -n anatolearn`.
# Prefer External Secrets Operator or Sealed Secrets in a real cluster; the keys below are what the manifests read.
apiVersion: v1
kind: Secret
metadata:
  name: anatolearn-secrets
  namespace: anatolearn
type: Opaque
stringData:
  # Runtime role (least privilege, created by ops/postgres-init/10-app-role.sh) and owner role (migrations, backups).
  DATABASE_URL: postgres://anatolearn_app:APP_DB_PASSWORD@DB_HOST:5432/anatolearn
  MIGRATION_DATABASE_URL: postgres://anatolearn:OWNER_PASSWORD@DB_HOST:5432/anatolearn
  PGHOST: DB_HOST
  PGUSER: anatolearn
  PGPASSWORD: OWNER_PASSWORD
  PGDATABASE: anatolearn
  # Shared by every replica: rate-limit counters and the read cache.
  REDIS_URL: redis://REDIS_HOST:6379
  JWT_SECRET: "openssl rand -base64 48"
  MFA_ENCRYPTION_KEY: "openssl rand -hex 32"
  TEACHER_INVITE_CODE: "at least 12 characters"
  ALLOWED_EMAIL_DOMAINS: school.edu,students.school.edu
  FRONTEND_ORIGINS: https://anatolearn.example.com
  WEBAUTHN_RP_ID: anatolearn.example.com
  S3_BUCKET: anatolearn-assets-YOURNAME
  S3_PREFIX: ""
  AWS_REGION: ap-southeast-1
