name: Images

# Builds the three deployable images. Pull requests only prove they build; pushes to main publish them to
# GitHub Container Registry tagged with the commit SHA, ready to reference from the Kubernetes overlay.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'anatolearn/backend/**'
      - 'anatolearn/ops/backup/**'
      - 'anatolearn/Dockerfile.web.prod'
      - 'anatolearn/ops/nginx*.conf'
      - '.github/workflows/images.yml'

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build${{ github.event_name == 'push' && ' and publish' || '' }} images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "REGISTRY=ghcr.io/$owner" >> "$GITHUB_ENV"
          docker build -t "ghcr.io/$owner/anatolearn-backend:$GITHUB_SHA" -f anatolearn/backend/Dockerfile.prod anatolearn/backend
          docker build -t "ghcr.io/$owner/anatolearn-web:$GITHUB_SHA" -f anatolearn/Dockerfile.web.prod anatolearn
          docker build -t "ghcr.io/$owner/anatolearn-backup:$GITHUB_SHA" anatolearn/ops/backup
      - name: Publish (main only)
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for name in backend web backup; do
            docker push "$REGISTRY/anatolearn-$name:$GITHUB_SHA"
          done
