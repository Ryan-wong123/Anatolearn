# Production stack:  docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Public entry point is Caddy (automatic HTTPS). Assets and database backups live in S3 via the EC2 instance role.
x-hardened: &hardened
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  pids_limit: 512
x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    <<: *logging
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anatolearn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-anatolearn}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./ops/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    <<: *logging
    security_opt: ["no-new-privileges:true"]
    environment:
      CLAMD_CONF_StreamMaxLength: 250M
      CLAMD_CONF_MaxFileSize: 250M
      CLAMD_CONF_MaxScanSize: 500M
    volumes:
      - clamav_db:/var/lib/clamav
    mem_limit: 3g

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    <<: [*hardened, *logging]
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: 2   # caddy + nginx
      # Runtime uses the least-privilege role; migrations run as the owner role.
      DATABASE_URL: postgres://anatolearn_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-anatolearn}
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-anatolearn}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-anatolearn}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random characters)}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?set FRONTEND_ORIGINS, e.g. https://anatolearn.example.com}
      TEACHER_INVITE_CODE: ${TEACHER_INVITE_CODE:?set TEACHER_INVITE_CODE}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION}
      CLAMAV_HOST: clamav
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-true}
      MFA_REQUIRED: ${MFA_REQUIRED:-true}
      UPLOAD_QUOTA_MB_PER_USER: ${UPLOAD_QUOTA_MB_PER_USER:-5120}
      UPLOAD_QUOTA_MB_TOTAL: ${UPLOAD_QUOTA_MB_TOTAL:-51200}
      SESSION_IDLE_MINUTES_STAFF: ${SESSION_IDLE_MINUTES_STAFF:-120}
      SESSION_IDLE_MINUTES_STUDENT: ${SESSION_IDLE_MINUTES_STUDENT:-480}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-AnatoLearn}
      IMAGE_MAX_DIMENSION: ${IMAGE_MAX_DIMENSION:-8000}
      IMAGE_MAX_MEGAPIXELS: ${IMAGE_MAX_MEGAPIXELS:-40}
    volumes:
      - upload_staging:/tmp
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web.prod
    <<: [*hardened, *logging]
    tmpfs:
      - /tmp
    mem_limit: 256m
    depends_on:
      - backend

  caddy:
    image: caddy:2
    <<: [*hardened, *logging]
    cap_add: [NET_BIND_SERVICE]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN, e.g. anatolearn.example.com}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 256m
    depends_on:
      - web

  backup:
    build: ./ops/backup
    restart: unless-stopped
    <<: *logging
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-anatolearn}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-anatolearn}
      S3_BUCKET: ${S3_BUCKET}
      S3_PREFIX: ${S3_PREFIX:-}
      AWS_REGION: ${AWS_REGION}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ./ops/restore-test.sh:/ops/restore-test.sh:ro
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  clamav_db:
  upload_staging:
  caddy_data:
  caddy_config:
