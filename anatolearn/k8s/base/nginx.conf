# Kubernetes copy of ops/nginx.conf (mounted by the web Deployment). Keep the two in step.
# Differences: the backend is the anatolearn-backend Service and DNS comes from the cluster resolver.
# Serves the built SPA and proxies API + authenticated teaching assets to the backend.
# TLS is terminated in front of this container (cloud load balancer, Caddy, Cloudflare, etc.).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 210m;   # largest upload is 200 MB plus form overhead

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = /healthz { access_log off; return 200 'ok'; }

  set $backend http://anatolearn-backend:5000;
  # Re-resolve through cluster DNS so pod IP changes during rollouts and scaling are picked up.
  resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

  # Friendly pages while the backend restarts or is being deployed
  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html { internal; root /usr/share/nginx/html; add_header Cache-Control "no-store" always; }
  location @api_down { default_type application/json; return 503 '{"message":"The service is restarting. Please try again in a moment."}'; }

  location /api/ {
    error_page 502 503 504 = @api_down;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Teaching assets. /videos/<number> is a SPA route, so only proxy asset paths.
  location ~ ^/(models|resources|thumbnails|captions)/ { proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header Range $http_range; }
  location ~ ^/videos/(?![0-9]+(/|$|\?)) { proxy_pass $backend; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_set_header Range $http_range; }

  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
