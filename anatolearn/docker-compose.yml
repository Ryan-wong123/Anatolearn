services:
  postgres:
    image: postgres:16
    container_name: anatolearn-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: anatolearn
      POSTGRES_PASSWORD: password
      POSTGRES_DB: anatolearn

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/sql:/docker-entrypoint-initdb.d:ro

  backend:
    build: ./backend
    container_name: anatolearn-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./public:/public

    environment:
      PORT: 5000
      DATABASE_URL: postgres://anatolearn:password@postgres:5432/anatolearn
      PUBLIC_DIR: /public
      JWT_SECRET: dev-only-secret-change-before-any-real-deployment

    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: anatolearn-frontend
    restart: unless-stopped

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      BACKEND_URL: http://backend:5000

    depends_on:
      - backend

volumes:
  postgres_data:
