name: Trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * 1'   # weekly: new CVEs appear in base images even when our code is unchanged

permissions:
  contents: read

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned CLI image. Run directly rather than through a third-party action.
  TRIVY: ghcr.io/aquasecurity/trivy:0.75.0

jobs:
  images:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      # --pull makes sure the node and nginx base layers are current, so a scan failure means a real, fixable problem.
      - name: Build the production images
        run: |
          docker build --pull -t anatolearn-backend:scan -f anatolearn/backend/Dockerfile.prod anatolearn/backend
          docker build --pull -t anatolearn-web:scan -f anatolearn/Dockerfile.web.prod anatolearn
      # Fails the job on HIGH or CRITICAL vulnerabilities that already have a fix. Unfixed ones are ignored because nothing
      # can be done about them yet; the weekly run picks them up once a fix ships. Accepted exceptions go in .trivyignore.
      - name: Scan the images we build
        run: |
          mkdir -p ~/.cache/trivy
          for image in anatolearn-backend:scan anatolearn-web:scan; do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD/.trivyignore:/work/.trivyignore:ro" -w /work "$TRIVY" \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /work/.trivyignore \
              --exit-code 1 --no-progress "$image"
            echo "::endgroup::"
          done

  third-party:
    name: Third-party image report (not blocking)
    runs-on: ubuntu-latest
    continue-on-error: true   # we cannot patch these ourselves; this is a to-do list for updating the image tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-third-party-${{ github.run_id }}
          restore-keys: trivy-db-third-party-
      - name: Scan the images the production stack pulls
        run: |
          mkdir -p ~/.cache/trivy
          for image in $(grep -E '^\s+image:' anatolearn/docker-compose.prod.yml | awk '{print $2}'); do
            echo "::group::$image"
            docker run --rm -v "$HOME/.cache/trivy:/root/.cache/trivy" "$TRIVY" \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress "$image"
            echo "::endgroup::"
          done
